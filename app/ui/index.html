<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel &amp; Expense Policy Copilot</title>
    <link rel="stylesheet" href="/ui/styles.css?v=20260521-context-scroll-radius">
  </head>
  <body>
    <main class="shell" aria-label="Travel and expense copilot">
      <section class="chat-pane is-intro" aria-label="Chat">
        <header class="topbar">
          <div class="brand-lockup">
            <div class="brand-mark">
              <img src="/ui/assets/atlas-mobility-logo.png" alt="" class="brand-logo">
            </div>
            <div>
              <p class="eyebrow">Atlas Mobility Group</p>
              <h1>Travel &amp; Expense Policy Copilot</h1>
            </div>
          </div>
        </header>

        <section class="answer-stream" aria-live="polite" aria-label="Answer stream" aria-hidden="true">
          <div class="message user-message is-empty" id="questionEcho">
            No question yet.
          </div>
          <article class="message answer-message">
            <div class="answer-meta">
              <span id="confidenceBadge" class="badge muted">Confidence pending</span>
              <span id="citationCount" class="meta-text">No citations yet</span>
              <span class="runtime" id="runtimeStatus" role="status" hidden></span>
            </div>
            <div id="answerText" class="answer-text">No answer yet.</div>
          </article>
        </section>

        <form class="composer" id="chatForm">
          <div class="example-ribbon" aria-label="Example questions">
            <button type="button" class="ribbon-button" id="examplesBack" aria-label="Scroll examples left">
              <span aria-hidden="true">&#9664;</span>
            </button>
            <div class="example-viewport" id="exampleViewport" tabindex="0">
              <div class="example-track" id="exampleTrack">
                <button type="button" class="example-button" data-question="Can I take a taxi from Prague airport after 21:00?">
                  Prague taxi after 21:00
                </button>
                <button type="button" class="example-button" data-question="Can I claim a taxi in Prague at 20:30 under the default after-hours rule?">
                  Prague taxi at 20:30
                </button>
                <button type="button" class="example-button" data-question="What is the hotel cap for Berlin?">
                  Berlin hotel cap
                </button>
                <button type="button" class="example-button" data-question="What is the meal cap for dinner in Vienna?">
                  Vienna dinner cap
                </button>
                <button type="button" class="example-button" data-question="Is a credit card statement enough evidence for a meal claim?">
                  Meal evidence
                </button>
                <button type="button" class="example-button" data-question="What evidence is required for a flight reimbursement?">
                  Flight evidence
                </button>
                <button type="button" class="example-button" data-question="Who can approve business class for an intercontinental flight above 6 hours?">
                  Business class approval
                </button>
                <button type="button" class="example-button" data-question="What happens if an employee submits an expense 95 days late?">
                  Late submission
                </button>
                <button type="button" class="example-button" data-question="Can employees use private taxis by default during business travel?">
                  Private taxi default
                </button>
                <button type="button" class="example-button" data-question="Can an employee claim a helicopter transfer from airport to hotel?">
                  Unsupported transfer
                </button>
              </div>
            </div>
            <button type="button" class="ribbon-button" id="examplesForward" aria-label="Scroll examples right">
              <span aria-hidden="true">&#9654;</span>
            </button>
          </div>
          <label class="sr-only" for="questionInput">Question</label>
          <div class="composer-input-row">
            <textarea
              id="questionInput"
              name="question"
              rows="1"
              autocomplete="off"
              required
            ></textarea>
            <button type="submit" class="primary-button composer-send" id="sendButton">Send</button>
          </div>
        </form>
      </section>

      <div
        class="split-resizer main-splitter"
        id="mainSplitter"
        role="separator"
        aria-label="Resize chat and retrieval panels"
        aria-orientation="vertical"
        tabindex="0"
      ></div>

      <aside class="debug-pane" aria-label="Retrieval debug panel">
        <header class="debug-header">
          <div>
            <p class="eyebrow">Global Mobility &amp; Finance</p>
            <h2>Retrieval Trace</h2>
          </div>
          <a class="download-button" href="/api/downloads/raw-data.zip" download>
            Download source files
          </a>
        </header>

        <section class="debug-section evidence-section">
          <div class="debug-section-header">
            <h3>Retrieved Chunks</h3>
            <button
              type="button"
              class="secondary-button compact render-markdown-toggle"
              id="renderMarkdownToggle"
              aria-pressed="false"
              hidden
            >
              Render markdown
            </button>
          </div>
          <div class="evidence-list" id="evidenceList">
            <p class="empty-state">No evidence yet.</p>
          </div>
        </section>

        <div
          class="split-resizer debug-splitter"
          id="debugSplitter"
          role="separator"
          aria-label="Resize retrieved chunks and assembled context"
          aria-orientation="horizontal"
          tabindex="0"
        ></div>

        <section class="debug-section context-section" id="contextSection">
          <div class="context-section-header">
            <h3>Assembled Context</h3>
            <button type="button" class="icon-button copy-context-button" id="copyContextButton" aria-label="Copy assembled context" hidden>
              <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                <path d="M5 15V7a2 2 0 0 1 2-2h8"></path>
              </svg>
              <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m5 12 4 4 10-10"></path>
              </svg>
            </button>
          </div>
          <div class="context-scroll">
            <div class="context-scroll-inner">
              <pre id="contextText">No context assembled yet.</pre>
            </div>
          </div>
        </section>

        <footer class="author-footer" id="authorFooter" hidden>
          <p>Built by <span id="authorName"></span></p>
          <div class="author-links" aria-label="Author links">
            <a id="authorLinkedin" target="_blank" rel="noreferrer">
              <svg class="author-link-icon author-link-icon--linkedin" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                <path d="M8 10v7M8 7.3v.1M12 17v-7M12 13.1c0-1.8 1.1-3.1 2.9-3.1 1.6 0 2.6 1.1 2.6 3.2V17"></path>
              </svg>
              <span>LinkedIn</span>
            </a>
            <a id="authorGithub" target="_blank" rel="noreferrer">
              <svg class="author-link-icon author-link-icon--github" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.76.6-3.34-1.18-3.34-1.18-.46-1.16-1.12-1.47-1.12-1.47-.91-.62.07-.61.07-.61 1.01.07 1.54 1.04 1.54 1.04.9 1.53 2.36 1.09 2.94.83.09-.65.35-1.09.64-1.34-2.2-.25-4.52-1.1-4.52-4.9 0-1.08.39-1.97 1.03-2.66-.1-.25-.45-1.26.1-2.63 0 0 .84-.27 2.75 1.02A9.46 9.46 0 0 1 12 6.07c.85 0 1.7.12 2.5.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.38.1 2.63.64.69 1.03 1.58 1.03 2.66 0 3.81-2.32 4.65-4.53 4.9.36.31.68.91.68 1.84v2.73c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" />
              </svg>
              <span>GitHub</span>
            </a>
          </div>
        </footer>
      </aside>
    </main>

    <script src="/ui/app.js?v=20260521-context-copy-state" defer></script>
  </body>
</html>
