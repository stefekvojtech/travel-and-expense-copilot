[project]
name = "travel-and-expense-copilot"
version = "0.1.0"
description = "Local-first grounded Travel and Expense Policy Copilot."
requires-python = ">=3.11,<3.15"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "chromadb>=0.5.0",
    "flashrank>=0.2.10",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.8",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.7",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]
