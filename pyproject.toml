[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-and-expense-copilot"
version = "0.1.0"
description = "Local-first grounded Travel and Expense Policy Copilot."
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "openpyxl>=3.1.5",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
ingest-all = "app.cli.ingest:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]
